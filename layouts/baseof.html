<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "body_class" . }}inner{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ if not .IsHome }}{{ partial "header.html" . }}{{ end }}
  <main id="main" class="{{ block "main_class" . }}col{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $site := resources.Get "js/site.js" | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
  <script src="{{ $site.RelPermalink }}" integrity="{{ $site.Data.Integrity }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
