{{ define "main" }}
  <article class="single-post">
    <header class="single-post-header">
      <h1 class="single-post-title">{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
        <p class="single-post-meta">
          Published on <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
          </p>
      {{ end }}
    </header>

    {{ with .Params.image }} <div class="single-post-banner">
            <img src="{{ . | relURL }}" alt="{{ $.Title }}">
        </div>
    {{ end }}

    {{ if .TableOfContents }}
      <aside class="table-of-contents">
        <h2>Table of Contents</h2>
        {{ .TableOfContents }}
      </aside>
    {{ end }}

    <div class="single-post-content">
      {{ .Content }} </div>

    <footer class="single-post-footer">
      <nav>
        <a href="{{ "/blog/" | relURL }}">← Back to Blog</a>
      </nav>
    </footer>
  </article>
{{ end }}
