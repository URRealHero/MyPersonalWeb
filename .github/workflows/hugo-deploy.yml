name: Deploy Hugo Site to GitHub Pages

on:
  # Runs on pushes targeting the 'source' branch
  push:
    branches:
      - source

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default to bash
defaults:
  run:
    shell: zsh

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetch Hugo themes if using submodules
          fetch-depth: 0       # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest' # Or specify your Hugo version
          # extended: true # Uncomment if your theme/SCSS needs Hugo Extended version

      - name: Build Hugo site
        run: hugo --minify # Output goes to ./public

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deploy job
  deploy:
    needs: build # Run after build job is successful
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # URL to the deployed site
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Official GitHub action for deploying Pages
        # This action automatically deploys the artifact from the 'build' job
        # to the correct gh-pages branch or updates the Pages site
        # for user/org pages, it updates the 'main' branch content via the Pages service.
